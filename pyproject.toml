[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-audit-cli"
version = "0.1.0"
description = "A small, $0, no-account on-page SEO audit CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Evan Dang" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/evanwork34/seo-audit-cli"

[project.scripts]
seo-audit = "seo_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["seo_audit"]
